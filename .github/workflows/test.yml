name: test
on:
  workflow_dispatch: {}
  # Disabled in favor of the Harness pipeline (androidclienttest.yaml).
  # push:
  #   branches:
  #     - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-app:
    name: Build App
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Gradle cache
        uses: gradle/gradle-build-action@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Test with Gradle
        run: ./gradlew test
