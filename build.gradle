import com.vanniktech.maven.publish.AndroidFusedLibrary
import org.gradle.api.publish.maven.MavenPublication

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // AGP 9.0.0-alpha13 requires Gradle 9.0 and has a new minSdk API, but builds hang
        // Staying with stable AGP 8.9.1 for now
//        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'com.android.tools.build:gradle:9.0.0-alpha13'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0'
        classpath "com.vanniktech:gradle-maven-publish-plugin:0.34.0"
    }
}

apply plugin: 'com.android.fused-library'
apply plugin: 'com.vanniktech.maven.publish'

// spec.gradle and jacoco.gradle removed - not compatible with fused library
// Note: Signing plugin applied conditionally to avoid conflicts with fused-library plugin

group = 'io.split.client'

ext {
    splitVersion = '5.4.3-rc1'
    jacocoVersion = '0.8.8'
}

version = splitVersion

// Define exclusions for JaCoCo coverage
def coverageExclusions = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*'
]

androidFusedLibrary {
    namespace = 'io.split.android.android_client'
    minSdk { version = release(19) }
    // Note: AGP 9.0.0-alpha13 uses new API: minSdk { version = release(19) }
}

// Workaround: Fused library plugin doesn't include consumer ProGuard files in AAR
// Manually copy the merged consumer proguard file into the AAR
afterEvaluate {
    tasks.named('bundle').configure {
        doLast {
            def aarFile = file("${buildDir}/outputs/aar/android-client.aar")
            def proguardFile = file("${buildDir}/intermediates/merged_consumer_proguard_file/release/mergeReleaseConsumerProguardFiles/proguard.txt")
            
            if (aarFile.exists() && proguardFile.exists()) {
                // Create temp directory to extract AAR
                def tempDir = file("${buildDir}/tmp/aar-repack")
                tempDir.deleteDir()
                tempDir.mkdirs()
                
                // Extract AAR
                copy {
                    from zipTree(aarFile)
                    into tempDir
                }
                
                // Copy proguard.txt
                copy {
                    from proguardFile
                    into tempDir
                }
                
                // Repack AAR
                ant.zip(destfile: aarFile, basedir: tempDir)
                
                println "Added consumer ProGuard rules to ${aarFile.name}"
            }
        }
    }
}

repositories {
    google()
    mavenCentral()
}

// Task to generate deps.txt with dependency tree
tasks.register('generateDepsFile') {
    description = 'Generates deps.txt file with the dependency tree'
    group = 'documentation'
    
    doLast {
        def depsFile = file("${projectDir}/deps.txt")
        def output = new StringBuilder()
        
        output.append("------------------------------------------------------------\n")
        output.append("Project '${project.path}'\n")
        output.append("------------------------------------------------------------\n\n")
        
        // For fused library, get dependencies from the included modules
        output.append("Fused Library Dependencies (from included modules)\n")
        output.append("=".repeat(60) + "\n\n")
        
        // Get dependencies from android-client-main (where the real dependencies are)
        def mainProject = project(':android-client-main')
        def config = mainProject.configurations.findByName('releaseRuntimeClasspath')
        
        if (config != null) {
            output.append("releaseRuntimeClasspath - Runtime classpath of compilation 'release' (target (androidJvm)).\n")
            config.resolvedConfiguration.firstLevelModuleDependencies.each { dep ->
                output.append("+--- ${dep.moduleGroup}:${dep.moduleName}:${dep.moduleVersion}\n")
                printDependencyTree(dep, output, "|    ", true)
            }
        }
        
        depsFile.text = output.toString()
        println "Generated deps.txt at ${depsFile.absolutePath}"
    }
}

void printDependencyTree(dependency, output, prefix, isLast) {
    dependency.children.eachWithIndex { child, index ->
        def isLastChild = (index == dependency.children.size() - 1)
        def connector = isLastChild ? "\\--- " : "+--- "
        def nextPrefix = isLastChild ? "     " : "|    "
        
        output.append("${prefix}${connector}${child.moduleGroup}:${child.moduleName}:${child.moduleVersion}\n")
        
        if (!child.children.isEmpty()) {
            printDependencyTree(child, output, prefix + nextPrefix, isLastChild)
        }
    }
}

dependencies {
    include project(':android-client-main')
    include project(':android-client-logger')
}

def splitPOM = {
    name = 'Split Android SDK'
    description = 'Official Split Android SDK'
    url = 'https://github.com/splitio/android-client'

    licenses {
        license {
            name = 'The Apache License, Version 2.0'
            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
        }
    }

    developers {
        developer {
            id = 'sdks'
            email = 'sdks@split.io'
        }
    }

    scm {
        connection = 'scm:git:git@github.com:splitio/android-client.git'
        developerConnection = 'scm:git@github.com:splitio/android-client.git'
        url = 'https://github.com/splitio/android-client'
    }
}

// Note: sourcesJar and javadocJar tasks removed - fused library has no source sets
// Tests are now in submodules

// Configure maven publish plugin - similar to old build.gradle but adapted for fused library
// The plugin should auto-detect Android Fused Library, but we configure coordinates and POM
mavenPublishing {
    coordinates("io.split.client", "android-client", splitVersion)
    pom(splitPOM)
    publishToMavenCentral(false)
    // Note: Plugin auto-detects AndroidFusedLibrary
    // For AGP 9.0.0-alpha9+, fusedLibraryComponent already includes sources,
    // but the plugin might still add emptySourcesJar, causing a conflict
}

// Manual GPG signing task - Gradle signing plugin doesn't work with fused library
tasks.register('signArtifacts') {
    description = 'Signs all Maven artifacts with GPG'
    group = 'publishing'
    
    doLast {
        // Task 2: Determine artifact directory path
        def groupPath = project.group.toString().replace('.', '/')
        def artifactId = 'android-client'
        def versionStr = project.version.toString()
        def artifactDir = file("${buildDir}/publishing/mavenCentral/${groupPath}/${artifactId}/${versionStr}")
        
        println "Signing artifacts in: ${artifactDir}"
        
        if (!artifactDir.exists()) {
            println "WARNING: Artifact directory does not exist: ${artifactDir}"
            println "Skipping signing. Run publishAllPublicationsToMavenCentralRepository first."
            return
        }
        
        // Task 4: Read GPG configuration from gradle.properties
        def keyId = project.findProperty('signing.keyId')
        def password = project.findProperty('signing.password')
        
        // Validate GPG configuration
        if (!keyId) {
            throw new GradleException("signing.keyId property is not set in gradle.properties")
        }
        if (!password) {
            throw new GradleException("signing.password property is not set in gradle.properties")
        }
        
        println "Using GPG key ID: ${keyId}"
        println "Using default GPG keyring"
        
        // Task 3: Find all artifacts to sign
        def artifactsToSign = []
        artifactDir.eachFile { file ->
            def name = file.name
            // Sign .aar, .jar, .pom, and .module files, but skip already signed .asc files
            if ((name.endsWith('.aar') || name.endsWith('.jar') || name.endsWith('.pom') || name.endsWith('.module')) && !name.endsWith('.asc')) {
                artifactsToSign << file
            }
        }
        
        if (artifactsToSign.isEmpty()) {
            println "WARNING: No artifacts found to sign in ${artifactDir}"
            return
        }
        
        println "Found ${artifactsToSign.size()} artifact(s) to sign:"
        artifactsToSign.each { println "  - ${it.name}" }
        
        // Task 7: Find GPG executable
        def gpgCommand = null
        def gpgPaths = [
            '/opt/homebrew/bin/gpg',  // macOS Homebrew on Apple Silicon - try first
            '/usr/local/bin/gpg',
            '/usr/bin/gpg',
            '/opt/local/bin/gpg'  // MacPorts
        ]
        
        // First, check if files exist
        for (path in gpgPaths) {
            def gpgFile = new File(path)
            if (gpgFile.exists() && gpgFile.canExecute()) {
                gpgCommand = path
                println "Found GPG at: ${gpgCommand}"
                break
            }
        }
        
        // If not found in common paths, try using 'gpg' from PATH
        if (gpgCommand == null) {
            try {
                def process = new ProcessBuilder(['gpg', '--version'])
                    .redirectErrorStream(true)
                    .start()
                def exitCode = process.waitFor()
                if (exitCode == 0) {
                    gpgCommand = 'gpg'
                    println "Found GPG in PATH"
                }
            } catch (Exception e) {
                // GPG not in PATH
            }
        }
        
        if (gpgCommand == null) {
            throw new GradleException("GPG is not installed or not found in common locations.\n" +
                "Please install GPG:\n" +
                "  macOS: brew install gnupg\n" +
                "  Linux: apt-get install gnupg or yum install gnupg\n" +
                "Searched in: ${gpgPaths.join(', ')}\n" +
                "If GPG is installed elsewhere, you can configure the path in the task.")
        }
        
        println "Using GPG: ${gpgCommand}"
        
        // Task 5: Sign each artifact
        artifactsToSign.each { artifact ->
            def ascFile = new File(artifact.parentFile, "${artifact.name}.asc")
            
            // Skip if already signed
            if (ascFile.exists()) {
                println "Signature already exists for ${artifact.name}, skipping"
                return
            }
            
            println "Signing: ${artifact.name}"
            
            try {
                // Use ProcessBuilder for GPG execution (avoids Gradle exec issues)
                // Note: Using default GPG keyring (GPG 2.1+ ignores --keyring option)
                def cmd = [
                    gpgCommand,
                    '--batch',
                    '--yes',
                    '--no-tty',
                    '--passphrase', password,
                    '--pinentry-mode', 'loopback',
                    '--local-user', keyId,
                    '--detach-sign',
                    '--armor',
                    artifact.absolutePath
                ]
                
                // Set GPG_TTY to avoid agent issues
                def processEnv = new ProcessBuilder().environment()
                processEnv.put('GPG_TTY', '')
                
                def process = new ProcessBuilder(cmd)
                    .redirectErrorStream(true)
                    .start()
                
                def exitCode = process.waitFor()
                
                if (exitCode != 0) {
                    def output = process.inputStream.text
                    throw new GradleException("Failed to sign ${artifact.name}. Exit code: ${exitCode}\nOutput: ${output}")
                }
                
                // Verify the signature was created
                if (!ascFile.exists()) {
                    throw new GradleException("Signature file was not created for ${artifact.name}")
                }
                
                println "  ✓ Created signature: ${ascFile.name}"
                
                // Verify the signature
                def verifyCmd = [
                    gpgCommand,
                    '--verify',
                    ascFile.absolutePath,
                    artifact.absolutePath
                ]
                
                def verifyProcess = new ProcessBuilder(verifyCmd)
                    .redirectErrorStream(true)
                    .start()
                
                def verifyExitCode = verifyProcess.waitFor()
                
                if (verifyExitCode == 0) {
                    println "  ✓ Signature verified successfully"
                } else {
                    println "  ⚠ Warning: Could not verify signature"
                }
                
            } catch (Exception e) {
                throw new GradleException("Failed to sign artifact ${artifact.name}: ${e.message}", e)
            }
        }
        
        println "Successfully signed ${artifactsToSign.size()} artifact(s)"
    }
}

// Task 6: Configure task dependencies
// Make signArtifacts run after artifacts are published but before upload
afterEvaluate {
    def signTask = tasks.findByName('signArtifacts')
    def publishTask = tasks.findByName('publishAllPublicationsToMavenCentralRepository')
    
    if (signTask && publishTask) {
        // signArtifacts depends on publishing (so artifacts exist)
        signTask.dependsOn(publishTask)
        
        // Make publish task finalize with signing
        publishTask.finalizedBy(signTask)
        
        println "Configured signArtifacts task to run after publishAllPublicationsToMavenCentralRepository"
    }
}

// Workaround: For AGP 9.0.0-alpha9+, fusedLibraryComponent already includes sources
// The maven publish plugin should not add emptySourcesJar for AGP >= alpha9,
// but if it does, we need to prevent the duplicate. The issue is that the plugin
// condition checks CURRENT_AGP_VERSION < AndroidPluginVersion(9, 0, 0).alpha(9),
// but for AGP 9.0.0-alpha13, this should be false, so withJavaSourcesJar shouldn't be called.
// However, if emptySourcesJar is still being created, we'll suppress publication of duplicate artifacts.
afterEvaluate {
    // Check if we have both merged sources and empty sources
    def emptySourcesJarTask = tasks.findByName("emptySourcesJar")
    if (emptySourcesJarTask != null) {
        // The plugin shouldn't have created this for AGP >= alpha9, but if it did,
        // we need to ensure only one sources artifact is published
        publishing.publications.withType(MavenPublication) { publication ->
            if (publication.name == "maven") {
                // Suppress the emptySourcesJar from being published
                // Keep only the sources from fusedLibraryComponent
                publication.artifacts.removeAll { artifact ->
                    // Remove artifacts that match the emptySourcesJar task output
                    try {
                        def artifactFile = artifact.file
                        if (artifactFile != null && artifactFile.exists()) {
                            def emptySourcesFile = emptySourcesJarTask.archiveFile.get().asFile
                            artifactFile == emptySourcesFile
                        } else {
                            // If we can't determine the file, check by classifier and if it's not from component
                            artifact.classifier == "sources" && artifact.extension == "jar" &&
                            !publication.artifacts.any { 
                                it != artifact && it.classifier == "sources" && 
                                it.buildDependencies != null
                            }
                        }
                    } catch (Exception e) {
                        false
                    }
                }
            }
        }
    }
}
