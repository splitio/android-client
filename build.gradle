buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // AGP 9.0.0-alpha13 requires Gradle 9.0 and has a new minSdk API, but builds hang
        // Staying with stable AGP 8.9.1 for now
//        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'com.android.tools.build:gradle:9.0.0-alpha13'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0'
        classpath "com.vanniktech:gradle-maven-publish-plugin:0.33.0"
    }
}

apply plugin: 'com.android.fused-library'
apply plugin: 'maven-publish'
// Temporarily removed signing and vanniktech plugins to test fused library build
// apply plugin: 'signing'
// apply plugin: 'com.vanniktech.maven.publish'
// spec.gradle and jacoco.gradle removed - not compatible with fused library

group = 'io.split.client'

ext {
    splitVersion = '5.5.0-alpha.1'
    jacocoVersion = '0.8.8'
}

version = splitVersion

// Define exclusions for JaCoCo coverage
def coverageExclusions = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*'
]

androidFusedLibrary {
    namespace = 'io.split.android.android_client'
    minSdk { version = release(19) }
    // Note: AGP 9.0.0-alpha13 uses new API: minSdk { version = release(19) }
}

// Workaround: Fused library plugin doesn't include consumer ProGuard files in AAR
// Manually copy the merged consumer proguard file into the AAR
afterEvaluate {
    tasks.named('bundle').configure {
        doLast {
            def aarFile = file("${buildDir}/outputs/aar/android-client.aar")
            def proguardFile = file("${buildDir}/intermediates/merged_consumer_proguard_file/release/mergeReleaseConsumerProguardFiles/proguard.txt")
            
            if (aarFile.exists() && proguardFile.exists()) {
                // Create temp directory to extract AAR
                def tempDir = file("${buildDir}/tmp/aar-repack")
                tempDir.deleteDir()
                tempDir.mkdirs()
                
                // Extract AAR
                copy {
                    from zipTree(aarFile)
                    into tempDir
                }
                
                // Copy proguard.txt
                copy {
                    from proguardFile
                    into tempDir
                }
                
                // Repack AAR
                ant.zip(destfile: aarFile, basedir: tempDir)
                
                println "Added consumer ProGuard rules to ${aarFile.name}"
            }
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // Include main module - contains all source code and will be bundled into the fused .aar
    include project(':android-client-main')

    // Include logger module - will be bundled into the fused .aar
    include project(':android-client-logger')
}

def splitPOM = {
    name = 'Split Android SDK'
    description = 'Official Split Android SDK'
    url = 'https://github.com/splitio/android-client'

    licenses {
        license {
            name = 'The Apache License, Version 2.0'
            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
        }
    }

    developers {
        developer {
            id = 'sdks'
            email = 'sdks@split.io'
        }
    }

    scm {
        connection = 'scm:git:git@github.com:splitio/android-client.git'
        developerConnection = 'scm:git@github.com:splitio/android-client.git'
        url = 'https://github.com/splitio/android-client'
    }
}

