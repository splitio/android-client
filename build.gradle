import com.vanniktech.maven.publish.AndroidFusedLibrary
import org.gradle.api.publish.maven.MavenPublication

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // AGP 9.0.0-alpha13 requires Gradle 9.0 and has a new minSdk API, but builds hang
        // Staying with stable AGP 8.9.1 for now
//        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'com.android.tools.build:gradle:9.0.0-alpha13'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0'
        classpath "com.vanniktech:gradle-maven-publish-plugin:0.34.0"
    }
}

apply plugin: 'com.android.fused-library'
apply plugin: 'com.vanniktech.maven.publish'

// spec.gradle and jacoco.gradle removed - not compatible with fused library
// Note: Signing plugin applied conditionally to avoid conflicts with fused-library plugin

group = 'io.split.client'

ext {
    splitVersion = '5.5.0-alpha.1'
    jacocoVersion = '0.8.8'
}

version = splitVersion

// Define exclusions for JaCoCo coverage
def coverageExclusions = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*'
]

androidFusedLibrary {
    namespace = 'io.split.android.android_client'
    minSdk { version = release(19) }
    // Note: AGP 9.0.0-alpha13 uses new API: minSdk { version = release(19) }
}

// Workaround: Fused library plugin doesn't include consumer ProGuard files in AAR
// Manually copy the merged consumer proguard file into the AAR
afterEvaluate {
    tasks.named('bundle').configure {
        doLast {
            def aarFile = file("${buildDir}/outputs/aar/android-client.aar")
            def proguardFile = file("${buildDir}/intermediates/merged_consumer_proguard_file/release/mergeReleaseConsumerProguardFiles/proguard.txt")
            
            if (aarFile.exists() && proguardFile.exists()) {
                // Create temp directory to extract AAR
                def tempDir = file("${buildDir}/tmp/aar-repack")
                tempDir.deleteDir()
                tempDir.mkdirs()
                
                // Extract AAR
                copy {
                    from zipTree(aarFile)
                    into tempDir
                }
                
                // Copy proguard.txt
                copy {
                    from proguardFile
                    into tempDir
                }
                
                // Repack AAR
                ant.zip(destfile: aarFile, basedir: tempDir)
                
                println "Added consumer ProGuard rules to ${aarFile.name}"
            }
        }
    }
}

repositories {
    google()
    mavenCentral()
}

// Task to generate deps.txt with dependency tree
tasks.register('generateDepsFile') {
    description = 'Generates deps.txt file with the dependency tree'
    group = 'documentation'
    
    doLast {
        def depsFile = file("${projectDir}/deps.txt")
        def output = new StringBuilder()
        
        output.append("------------------------------------------------------------\n")
        output.append("Project '${project.path}'\n")
        output.append("------------------------------------------------------------\n\n")
        
        // For fused library, get dependencies from the included modules
        output.append("Fused Library Dependencies (from included modules)\n")
        output.append("=".repeat(60) + "\n\n")
        
        // Get dependencies from android-client-main (where the real dependencies are)
        def mainProject = project(':android-client-main')
        def config = mainProject.configurations.findByName('releaseRuntimeClasspath')
        
        if (config != null) {
            output.append("releaseRuntimeClasspath - Runtime classpath of compilation 'release' (target (androidJvm)).\n")
            config.resolvedConfiguration.firstLevelModuleDependencies.each { dep ->
                output.append("+--- ${dep.moduleGroup}:${dep.moduleName}:${dep.moduleVersion}\n")
                printDependencyTree(dep, output, "|    ", true)
            }
        }
        
        depsFile.text = output.toString()
        println "Generated deps.txt at ${depsFile.absolutePath}"
    }
}

void printDependencyTree(dependency, output, prefix, isLast) {
    dependency.children.eachWithIndex { child, index ->
        def isLastChild = (index == dependency.children.size() - 1)
        def connector = isLastChild ? "\\--- " : "+--- "
        def nextPrefix = isLastChild ? "     " : "|    "
        
        output.append("${prefix}${connector}${child.moduleGroup}:${child.moduleName}:${child.moduleVersion}\n")
        
        if (!child.children.isEmpty()) {
            printDependencyTree(child, output, prefix + nextPrefix, isLastChild)
        }
    }
}

dependencies {
    include project(':android-client-main')
}

def splitPOM = {
    name = 'Split Android SDK'
    description = 'Official Split Android SDK'
    url = 'https://github.com/splitio/android-client'

    licenses {
        license {
            name = 'The Apache License, Version 2.0'
            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
        }
    }

    developers {
        developer {
            id = 'sdks'
            email = 'sdks@split.io'
        }
    }

    scm {
        connection = 'scm:git:git@github.com:splitio/android-client.git'
        developerConnection = 'scm:git@github.com:splitio/android-client.git'
        url = 'https://github.com/splitio/android-client'
    }
}

// Note: sourcesJar and javadocJar tasks removed - fused library has no source sets
// Tests are now in submodules

// Configure maven publish plugin - similar to old build.gradle but adapted for fused library
// The plugin should auto-detect Android Fused Library, but we configure coordinates and POM
mavenPublishing {
    coordinates("io.split.client", "android-client", splitVersion)
    pom(splitPOM)
    publishToMavenCentral(false)
    // Note: Plugin auto-detects AndroidFusedLibrary
    // For AGP 9.0.0-alpha9+, fusedLibraryComponent already includes sources,
    // but the plugin might still add emptySourcesJar, causing a conflict
}

// Workaround: For AGP 9.0.0-alpha9+, fusedLibraryComponent already includes sources
// The maven publish plugin should not add emptySourcesJar for AGP >= alpha9,
// but if it does, we need to prevent the duplicate. The issue is that the plugin
// condition checks CURRENT_AGP_VERSION < AndroidPluginVersion(9, 0, 0).alpha(9),
// but for AGP 9.0.0-alpha13, this should be false, so withJavaSourcesJar shouldn't be called.
// However, if emptySourcesJar is still being created, we'll suppress publication of duplicate artifacts.
afterEvaluate {
    // Check if we have both merged sources and empty sources
    def emptySourcesJarTask = tasks.findByName("emptySourcesJar")
    if (emptySourcesJarTask != null) {
        // The plugin shouldn't have created this for AGP >= alpha9, but if it did,
        // we need to ensure only one sources artifact is published
        publishing.publications.withType(MavenPublication) { publication ->
            if (publication.name == "maven") {
                // Suppress the emptySourcesJar from being published
                // Keep only the sources from fusedLibraryComponent
                publication.artifacts.removeAll { artifact ->
                    // Remove artifacts that match the emptySourcesJar task output
                    try {
                        def artifactFile = artifact.file
                        if (artifactFile != null && artifactFile.exists()) {
                            def emptySourcesFile = emptySourcesJarTask.archiveFile.get().asFile
                            artifactFile == emptySourcesFile
                        } else {
                            // If we can't determine the file, check by classifier and if it's not from component
                            artifact.classifier == "sources" && artifact.extension == "jar" &&
                            !publication.artifacts.any { 
                                it != artifact && it.classifier == "sources" && 
                                it.buildDependencies != null
                            }
                        }
                    } catch (Exception e) {
                        false
                    }
                }
            }
        }
    }
}
